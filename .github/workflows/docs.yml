name: CompoSED documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sphinx:
    name: Sphinx user guide and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core package and documentation tools
        run: python -m pip install -e ".[docs]"
      - name: Check core imports
        run: python -c "import composed, inftools; print(composed.__version__)"
      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
