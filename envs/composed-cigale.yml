name: composed-cigale
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # CIGALE v2022.0's sfhperiodic module uses the deprecated np.float alias.
  # NumPy 1.23.5 is the last release retaining it and supports Python 3.11.
  - numpy=1.23.5
  - scipy=1.12
  - astropy=6.1
  - configobj
  # Install CIGALE v2022.0 from its upstream GitLab tutorial/release after
  # creating the env.  Then install CompoSED from the repository root.
