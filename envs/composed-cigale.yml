name: composed-cigale
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Legacy native CIGALE v2022.0 modules such as sfhperiodic use np.float.
  # Named CompoSED SFHs do not, but the native module-list API remains public.
  - numpy=1.23.5
  - scipy=1.12
  - astropy=6.1
  - configobj
  # CIGALE v2022.0 imports pkg_resources at runtime.
  - setuptools>=77,<81
  # Install CIGALE v2022.0 from its upstream GitLab tutorial/release after
  # creating the env.  Then install CompoSED from the repository root.
