[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "composed-sed"
version = "0.1.1"
description = "Composable Bayesian SED fitting and photo-z inference."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["astronomy", "SED fitting", "Bayesian inference", "photometric redshift", "SBI"]
authors = [
  { name = "Gregoire Aufort" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy",
  "astropy",
]

[project.urls]
Homepage = "https://github.com/gregoireaufort/CompoSED"
Documentation = "https://gregoireaufort.github.io/CompoSED/"
Repository = "https://github.com/gregoireaufort/CompoSED"
Issues = "https://github.com/gregoireaufort/CompoSED/issues"

[project.optional-dependencies]
dev = [
  "pytest",
  "matplotlib",
  "scipy",
]
plot = [
  "matplotlib",
  "corner",
]
samplers = [
  "scipy",
  "emcee",
  "pocomc",
  "tqdm",
]
mc-diagnostics = [
  "arviz>=0.20,<2",
]
notebooks = [
  "jupyterlab",
  "ipykernel",
  "pandas",
  "tqdm",
]
fsps = [
  "fsps==0.4.7",
  "astro-sedpy==0.4.1",
]
cigale = [
  # Install CIGALE itself from the upstream v2022.0 tutorial/release:
  # https://gitlab.lam.fr/cigale/cigale/-/tree/v2022.0
]
sbi = [
  "torch",
  "nflows",
]
mdn = [
  "torch",
]
diffusion = [
  "torch",
]
diagnostics-extra = [
  "matplotlib",
  "tarp",
]
docs = [
  "sphinx>=7",
  "myst-parser>=2",
  "furo>=2024.8.6",
  "sphinx-copybutton>=0.5",
]
all = [
  "fsps==0.4.7",
  "astro-sedpy==0.4.1",
  "torch",
  "nflows",
  "tarp",
  "scipy",
  "emcee",
  "pocomc",
  "arviz>=0.20,<2",
  "corner",
  "pandas",
  "tqdm",
  "matplotlib",
  "pytest",
  "sphinx>=7",
  "myst-parser>=2",
  "furo>=2024.8.6",
  "sphinx-copybutton>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["composed*", "inftools*"]
